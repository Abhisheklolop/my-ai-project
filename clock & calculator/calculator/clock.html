<!DOCTYPE html>
<html>
<head>
  <title>Digital Clock</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #101726, #05070d 55%);
      color: #79f264;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .layout {
      width: min(1200px, 92vw);
      display: flex;
      gap: 30px;
      align-items: stretch;
      justify-content: center;
    }

    .ai-panel {
      width: 290px;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(121, 242, 100, 0.35);
      border-radius: 22px;
      box-shadow: 0 0 25px rgba(64, 124, 255, 0.25);
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .ai-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .ai-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #3b82f6, #22c55e);
      font-size: 22px;
    }

    .ai-name {
      font-size: 1.05rem;
      color: #d9f99d;
      font-weight: bold;
    }

    .ai-status {
      color: #8bffb1;
      font-size: 0.75rem;
      margin-top: 4px;
    }

    .ai-chat {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 12px;
      min-height: 190px;
      max-height: 270px;
      overflow-y: auto;
      color: #e2e8f0;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 85%;
      padding: 10px 12px;
      border-radius: 14px;
      word-wrap: break-word;
      font-size: 0.9rem;
      line-height: 1.45;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.2);
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.ai {
      align-self: flex-start;
      background: linear-gradient(180deg, rgba(51,65,85,0.96), rgba(30,41,59,0.95));
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-bottom-left-radius: 4px;
    }

    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 12px;
    }

    .quick-replies button,
    .clear-chat-btn {
      margin: 0;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.14);
      color: #dbeafe;
      border: 1px solid rgba(96, 165, 250, 0.5);
      font-size: 0.78rem;
      cursor: pointer;
    }

    .clear-chat-btn {
      width: 100%;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(248, 113, 113, 0.45);
      color: #fecaca;
      margin-top: 8px;
    }

    .ai-input-wrap {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .ai-input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(15, 23, 42, 0.8);
      color: white;
    }

    .ai-button {
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #22c55e);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .clock-panel {
      flex: 1;
      text-align: center;
      min-width: 0;
    }

    #time {
      font-size: 100px;
      letter-spacing: 5px;
    }

    #date {
      font-size: 50px;
      color: #58da8a;
      margin-top: 20px;
    }

    h2 {
      color: rgb(207, 215, 204);
      margin-bottom: 30px;
    }

    #features {
      margin-top: 50px;
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    .card {
      background: rgba(68, 12, 12, 0.1);
      padding: 20px;
      border-radius: 15px;
      width: 500px;
      text-align: center;
      box-shadow: 0 0 15px #0c08e1;
    }

    #stopwatch {
      font-size: 25px;
      margin: 10px 0;
    }

    button {
      margin: 5px;
      padding: 6px 12px;
      border: none;
      background: #7978b6;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #6764f2;
    }

    .calculator-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
    }

    .calculator-button a {
      color: inherit;
      text-decoration: none;
    }

    .calculator-icon {
      font-size: 18px;
    }

    input {
      padding: 5px;
      margin: 10px;
    }

    @media (max-width: 900px) {
      .layout {
        flex-direction: column;
      }

      .ai-panel {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="layout">
  <aside class="ai-panel">
    <div>
      <div class="ai-header">
        <div class="ai-avatar">🤖</div>
        <div>
          <div class="ai-name">ClockMate AI</div>
          <div class="ai-status">Online</div>
        </div>
      </div>

      <div class="ai-chat" id="aiChatBox">
        <div class="message ai">Hi! I can help with time, alarms, and stopwatch tasks.</div>
        <div class="message ai">Try asking me anything about your clock.</div>
      </div>

      <div class="quick-replies">
        <button onclick="sendQuickReply('What time is it?')">What time is it?</button>
        <button onclick="sendQuickReply('Set alarm')">Set alarm</button>
        <button onclick="sendQuickReply('Start stopwatch')">Start stopwatch</button>
      </div>

      <div class="ai-input-wrap">
        <input id="aiPrompt" class="ai-input" type="text" placeholder="Ask ClockMate AI..." />
        <button class="ai-button" onclick="askAI()">Send</button>
      </div>
      <button class="clear-chat-btn" onclick="clearChat()">Clear Chat</button>
    </div>
  </aside>

  <main class="clock-panel">
    <h2>Digital Clock ⏰</h2>
    <h1 id="time">Loading...</h1>
    <h3 id="date"></h3>

    <div id="features">
      <div class="card">
        <h3>⏱ Stopwatch</h3>
        <p id="stopwatch">00:00:00</p>
        <button onclick="startStopwatch()">Start</button>
        <button onclick="pauseStopwatch()">Pause</button>
        <button onclick="resetStopwatch()">Reset</button>
      </div>

      <div class="card">
        <h3>🔔 Alarm</h3>
        <input type="time" id="alarmTime" />
        <button onclick="setAlarm()">Set</button>
        <button onclick="stopAlarm()">Stop</button>
        <p id="alarmStatus"></p>
      </div>
    </div>

    <button class="calculator-button">
      <span class="calculator-icon" aria-hidden="true">🧮</span>
      <a href="index.html">Calculator</a>
    </button>
  </main>
</div>

<script>
function updateClock() {
  const now = new Date();
  const time = now.toLocaleTimeString();
  const day = now.toLocaleDateString('en-US', { weekday: 'long' });
  const date = now.toLocaleDateString();

  document.getElementById("time").innerText = time;
  document.getElementById("date").innerText = day + ", " + date;
}

setInterval(updateClock, 1000);
updateClock();

let stopwatchInterval = null;
let seconds = 0;
let running = false;

function updateStopwatch() {
  let hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
  let mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
  let secs = String(seconds % 60).padStart(2, '0');

  document.getElementById("stopwatch").innerText = `${hrs}:${mins}:${secs}`;
  seconds++;
}

function startStopwatch() {
  if (!running) {
    stopwatchInterval = setInterval(updateStopwatch, 1000);
    running = true;
  }
}

function pauseStopwatch() {
  clearInterval(stopwatchInterval);
  running = false;
}

function resetStopwatch() {
  clearInterval(stopwatchInterval);
  seconds = 0;
  running = false;
  document.getElementById("stopwatch").innerText = "00:00:00";
}

let alarmTime = null;
let alarmActive = false;

function setAlarm() {
  alarmTime = document.getElementById("alarmTime").value;
  alarmActive = true;
  document.getElementById("alarmStatus").innerText = "Alarm set for " + alarmTime;
}

function stopAlarm() {
  alarmActive = false;
  document.getElementById("alarmStatus").innerText = "Alarm stopped";
}

setInterval(() => {
  if (!alarmActive) return;

  const now = new Date();
  const currentTime = now.toTimeString().slice(0, 5);

  if (alarmTime === currentTime) {
    document.getElementById("alarmStatus").innerText = "⏰ Alarm Ringing!";
    alert("⏰ Wake up!");
    alarmActive = false;
  }
}, 1000);

function createMessage(text, sender) {
  const chatBox = document.getElementById("aiChatBox");
  const messageEl = document.createElement("div");
  messageEl.className = "message " + sender;
  messageEl.textContent = text;
  chatBox.appendChild(messageEl);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function clearChat() {
  const chatBox = document.getElementById("aiChatBox");
  chatBox.innerHTML = "";
  createMessage("Hi! I can help with time, alarms, and stopwatch tasks.", "ai");
  createMessage("Try asking me anything about your clock.", "ai");
}

function generateLocalAIReply(message) {
  const lower = message.toLowerCase();

  if (lower.includes("time")) {
    return "The current time is " + new Date().toLocaleTimeString() + ".";
  }
  if (lower.includes("alarm")) {
    return "Use the alarm box on the right and click Set to schedule a wake-up time.";
  }
  if (lower.includes("stopwatch")) {
    return "Click Start on the stopwatch card to begin timing, then Pause or Reset when needed.";
  }
  if (lower.includes("hello") || lower.includes("hi")) {
    return "Hello! I am ClockMate AI. How can I help with your clock today?";
  }
  if (lower.includes("date")) {
    return "Today is " + new Date().toDateString() + ".";
  }

  return "I can help with the current time, alarms, stopwatch controls, and quick clock actions.";
}

function sendQuickReply(text) {
  const input = document.getElementById("aiPrompt");
  input.value = text;
  askAI();
}

function askAI() {
  const input = document.getElementById("aiPrompt");
  const message = input.value.trim();

  if (!message) return;

  createMessage(message, "user");
  input.value = "";

  const reply = generateLocalAIReply(message);
  setTimeout(() => {
    createMessage("AI: " + reply, "ai");
  }, 250);
}

const inputField = document.getElementById("aiPrompt");
inputField.addEventListener("keydown", function (event) {
  if (event.key === "Enter") {
    askAI();
  }
});
</script>

</body>
</html>
